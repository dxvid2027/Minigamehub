<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>MegaPlay Hub — Premium Browser Gaming Platform</title>
<meta name="description" content="MegaPlay Hub: 30+ polished mini games, achievements, progression and daily challenges — all in your browser.">
<meta name="theme-color" content="#0a0d18">

<!-- Home-screen / installable app icons -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="167x167" href="assets/icons/apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="assets/icons/apple-touch-icon-152.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MegaPlay">
<meta name="application-name" content="MegaPlay Hub">

<!-- Social preview -->
<meta property="og:title" content="MegaPlay Hub — Premium Browser Gaming Platform">
<meta property="og:description" content="30 polished mini games with progression, achievements and daily challenges. No installs, no ads, just play.">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/images/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/sora-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/games.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

<div id="boot-loader">
  <div class="boot-mark">M</div>
  <div class="logo">MegaPlay Hub</div>
  <div class="bar"><span></span></div>
</div>

<canvas id="bg-canvas"></canvas>

<div id="app-root">
  <div class="app-shell">

    <aside class="sidebar" id="sidebar">
      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation"></button>
      <div class="brand">
        <div class="brand-mark">M</div>
        <div class="brand-name">MegaPlay</div>
      </div>
      <nav class="nav-list" id="nav-list" aria-label="Primary">
        <!-- injected by navigation.js -->
      </nav>
      <div class="sidebar-footer">
        <div class="nav-item" style="opacity:.45;pointer-events:none;">
          <span class="nav-icon" style="font-size:.62rem;font-weight:800;letter-spacing:.04em;">1.1</span>
          <span class="nav-label">Version 1.1.0</span>
        </div>
      </div>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <button class="icon-btn" id="mobile-nav-btn" aria-label="Menu" style="display:none"></button>
        <div class="search-box">
          <span id="search-icon" aria-hidden="true"></span>
          <input id="global-search" type="search" placeholder="Search 30 games…" aria-label="Search games">
        </div>
        <div class="topbar-spacer"></div>
        <div class="topbar-actions">
          <div class="currency-chip coins" title="Coins"><span class="ic" id="coin-icon"></span><span id="topbar-coins">0</span></div>
          <div class="currency-chip xp" title="Experience"><span class="ic" id="xp-icon"></span><span id="topbar-xp">Lv 1</span></div>
          <button class="icon-btn" id="mute-btn" title="Toggle sound" aria-label="Toggle sound"></button>
          <a class="profile-chip" href="#/profile" data-route="/profile" title="Profile">
            <span class="avatar" id="topbar-avatar" style="width:32px;height:32px;font-size:.9rem;">P</span>
          </a>
        </div>
      </header>

      <main id="page-outlet" class="page" role="main" aria-live="polite">
        <!-- routed page content injected here -->
      </main>
    </div>
  </div>
</div>

<nav class="bottom-nav" id="bottom-nav" aria-label="Primary mobile">
  <!-- injected by navigation.js -->
</nav>

<div id="toast-root" aria-live="polite"></div>
<div id="modal-root"></div>

<script type="module" src="js/core/app.js"></script>
</body>
</html>
